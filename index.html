<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Для моєї коханої дружини ❤️ Гра-сортування кольорів">
<meta name="theme-color" content="#FFE3D3" id="tc">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Для коханої">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<title>Для коханої ❤️ Сортування</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Marck+Script&family=Unbounded:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --sky1:#FFE3D3;--sky2:#F6D3EC;--sky3:#D9D6FF;--ink:#2B1B44;--accent:#FF3D77;--gold:#F5B03E;
  --ink2:rgba(43,27,68,.62);--line:rgba(43,27,68,.13);--glassEdge:#CBC6D1;--shc:rgba(43,27,68,.5);
  --accentSoft:rgba(255,61,119,.28);--accentGlow:rgba(255,61,119,.55);--goldSoft:rgba(245,176,62,.45);
  --overlay:rgba(43,27,68,.45);--hardInk:#D2331E;
  --surf:rgba(255,255,255,.66);--edge:rgba(255,255,255,.92);--key:#fff;--sheet:#FFF9FB;--glass:rgba(255,255,255,.3);
  --shadow:0 12px 28px -14px var(--shc);
  --u:34px;--tw:50px;--g:15px;
  --display:"Unbounded","Trebuchet MS",system-ui,sans-serif;--hand:"Marck Script","Segoe Script",cursive;
  color-scheme:light;box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
:root.dark{--surf:rgba(255,255,255,.09);--edge:rgba(255,255,255,.16);--key:rgba(255,255,255,.13);--sheet:#1E1239;--glass:rgba(255,255,255,.06);color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{height:100%;touch-action:manipulation;overscroll-behavior:none;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;height:100%;position:relative;overflow:hidden;font-family:var(--display);color:var(--ink);
  background:radial-gradient(70% 38% at 50% 0%,rgba(255,255,255,.55),rgba(255,255,255,0)),linear-gradient(165deg,var(--sky1),var(--sky2) 52%,var(--sky3));
  background-color:var(--sky1);user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;-webkit-font-smoothing:antialiased;
  touch-action:manipulation;overscroll-behavior:none}
:root.dark body{background:radial-gradient(70% 38% at 50% 0%,rgba(255,92,147,.2),rgba(255,92,147,0)),linear-gradient(165deg,var(--sky1),var(--sky2) 52%,var(--sky3));background-color:var(--sky1)}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}
button:focus-visible{outline:3px solid var(--accent);outline-offset:3px;border-radius:14px}
svg{display:block}
.ico{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* фон */
.decor{position:fixed;top:0;right:0;bottom:0;left:0;pointer-events:none;overflow:hidden}
.decor i{position:absolute;border-radius:50%;background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.8),rgba(255,255,255,0) 70%);
  animation:drift 22s ease-in-out infinite alternate;will-change:transform}
.decor i:nth-child(1){width:280px;height:280px;left:-110px;top:6%}
.decor i:nth-child(2){width:360px;height:360px;right:-170px;top:36%;animation-duration:28s;animation-delay:-8s}
.decor i:nth-child(3){width:220px;height:220px;left:18%;bottom:-110px;animation-duration:25s;animation-delay:-14s}
:root.dark .decor i{background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.1),rgba(255,255,255,0) 70%)}
@keyframes drift{to{transform:translate(30px,-40px) scale(1.08)}}
.screen{position:absolute;top:0;right:0;bottom:0;left:0;display:flex;flex-direction:column;align-items:center}

/* заставка */
#splash{justify-content:center;text-align:center;z-index:5;overflow:hidden;transition:opacity .45s,visibility 0s}
#splash.hide{opacity:0;visibility:hidden;transition:opacity .45s,visibility 0s .45s}
#splash.hide,#splash.hide *{pointer-events:none!important}
#splash>*:not(.bub){position:relative;z-index:1}
#game{transition:opacity .45s}
body.onSplash #game{opacity:0;pointer-events:none}
.bub{position:absolute;bottom:-30px;border-radius:50%;border:1.5px solid rgba(255,255,255,.8);
  background:radial-gradient(circle at 30% 30%,rgba(255,255,255,.75),rgba(255,255,255,.06) 62%);animation:rise linear infinite;pointer-events:none}
:root.dark .bub{border-color:rgba(255,255,255,.25);background:radial-gradient(circle at 30% 30%,rgba(255,255,255,.25),rgba(255,255,255,0) 62%)}
@keyframes rise{to{transform:translateY(-112vh)}}
.ava{position:relative;width:204px;height:204px;flex:none}
.ring{position:absolute;top:0;left:0;width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:4.5}
.ring .tr{stroke:var(--surf)}
.ring .pr{stroke:url(#rg);stroke-linecap:round;stroke-dasharray:345.6;stroke-dashoffset:345.6;animation:fill 2.1s cubic-bezier(.6,.1,.3,1) forwards}
@keyframes fill{to{stroke-dashoffset:0}}
.photo{position:absolute;top:17px;left:17px;right:17px;bottom:17px;border-radius:50%;background:var(--surf) center/cover;display:grid;place-items:center;
  font-size:11px;line-height:1.4;color:var(--ink2);padding:26px;cursor:pointer;box-shadow:0 0 0 5px var(--key),0 24px 44px -18px var(--shc)}
.badge{position:absolute;right:6px;bottom:12px;width:52px;height:52px;border-radius:50%;background:var(--key);display:grid;place-items:center;
  color:var(--accent);box-shadow:var(--shadow);animation:beat 1.8s ease-in-out infinite}
.badge svg{width:27px;height:27px}
@keyframes beat{0%,55%,100%{transform:scale(1)}18%{transform:scale(1.15)}36%{transform:scale(.97)}}
.love{font-family:var(--hand);font-weight:400;font-size:44px;line-height:1;margin:26px 24px 8px;max-width:340px}
.from{font-family:var(--hand);font-size:26px;margin:0;color:var(--ink2)}
#menu{display:flex;flex-direction:column;align-items:center;gap:12px;margin-top:28px;opacity:0;transform:translateY(16px);
  transition:opacity .5s,transform .5s cubic-bezier(.2,.8,.2,1);pointer-events:none}
#splash.ready #menu{opacity:1;transform:none;pointer-events:auto}
.chips{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:4px}
.chip{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 12px;border-radius:15px;background:var(--surf);
  border:1px solid var(--edge);font-size:12px;font-weight:600;white-space:nowrap}
.chip svg{width:15px;height:15px;color:var(--gold)}
.btn{display:flex;flex-direction:column;align-items:center;justify-content:center;width:264px;height:66px;border-radius:22px;
  font-weight:700;font-size:19px;letter-spacing:-.01em;transition:transform .12s,box-shadow .12s}
.btn small{font-size:11px;font-weight:400;opacity:.85;margin-top:3px;letter-spacing:0}
.btn:active{transform:translateY(3px)}
.primary{background:var(--accent);color:#fff;box-shadow:inset 0 -5px 0 rgba(0,0,0,.17),0 18px 30px -14px var(--accentGlow)}
.primary:active{box-shadow:inset 0 -2px 0 rgba(0,0,0,.17),0 10px 20px -14px var(--accentGlow)}
.secondary{background:var(--ink);color:var(--sky1);height:58px;font-size:16px;box-shadow:inset 0 -5px 0 rgba(0,0,0,.28),0 16px 28px -16px var(--shc)}
.hl{display:flex;align-items:center;gap:7px}
.hl svg{width:18px;height:18px;color:#FF6A3D}

/* игровой экран */
.hud{width:100%;max-width:480px;display:flex;align-items:center;gap:8px;padding:10px 16px 0}
.sp{flex:1}
.ib{width:44px;height:44px;border-radius:15px;background:var(--surf);border:1px solid var(--edge);display:grid;place-items:center;
  box-shadow:var(--shadow);position:relative;flex:none;transition:transform .12s}
.ib:active{transform:scale(.92)}
.ib>svg.ico{width:22px;height:22px}
.rank svg{width:34px;height:34px;transform:rotate(-90deg)}
.rank circle{fill:none;stroke-width:3.5}
.rank .tr{stroke:var(--line)}
.rank .pr{stroke:var(--accent);stroke-linecap:round;stroke-dasharray:81.7;transition:stroke-dashoffset .6s}
.rank b{position:absolute;top:0;left:0;right:0;bottom:0;display:grid;place-items:center;font-size:13px;font-weight:700}
.coins{height:44px;padding:0 15px 0 11px;border-radius:15px;background:var(--surf);border:1px solid var(--edge);box-shadow:var(--shadow);
  display:flex;align-items:center;gap:8px;font-weight:700;font-size:15px;font-variant-numeric:tabular-nums}
.coin{display:inline-block;width:18px;height:18px;border-radius:50%;flex:none;vertical-align:-3px;
  background:radial-gradient(circle at 34% 30%,#FFF4C9 0 18%,#F9C04D 46%,#D9861A);box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.45),0 1px 2px rgba(0,0,0,.25)}
.coin.fly{position:fixed;z-index:9;width:20px;height:20px;pointer-events:none;will-change:transform}
.head{text-align:center;margin-top:12px;min-height:76px}
.lvl{display:flex;align-items:baseline;justify-content:center;gap:9px;line-height:1}
.lvl small{font-size:14px;font-weight:600;color:var(--ink2);display:inline-flex;align-items:center;gap:5px}
.lvl small svg{width:16px;height:16px;color:#FF6A3D}
.lvl b{font-size:32px;font-weight:700;letter-spacing:-.03em;display:inline-block}
.lvl b.pop{animation:numpop .55s cubic-bezier(.34,1.56,.64,1)}
@keyframes numpop{from{transform:scale(.4);opacity:0}}
body.hard .lvl small,body.hard .lvl b{color:var(--hardInk)}
.pips{display:flex;gap:6px;justify-content:center;align-items:center;margin-top:11px;height:16px}
.pip{width:8px;height:8px;border-radius:50%;background:var(--line);transition:background .3s}
.pip.on{background:var(--accent)}
.pip.now{background:var(--key);box-shadow:0 0 0 2px var(--accent)}
.pips svg{width:17px;height:17px;color:var(--accent);margin-left:3px}
.sub{display:flex;gap:16px;justify-content:center;margin-top:8px;font-size:11px;color:var(--ink2)}
.sub b{color:var(--ink);font-weight:700;font-variant-numeric:tabular-nums}

/* полки и колбы */
#board{flex:1;min-height:0;width:100%;max-width:480px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:18px;padding:6px 12px 10px}
.loading{font-size:12px;color:var(--ink2)}
.shelf{position:relative;display:flex;justify-content:center;align-items:flex-end;gap:var(--g);padding:calc(var(--u)*.5) 18px 7px}
.shelf::after{content:"";position:absolute;left:0;right:0;bottom:0;height:12px;border-radius:7px;
  background:linear-gradient(180deg,rgba(255,255,255,.96),rgba(255,255,255,.5));border:1px solid var(--edge);box-shadow:0 14px 20px -12px var(--shc)}
:root.dark .shelf::after{background:linear-gradient(180deg,rgba(255,255,255,.24),rgba(255,255,255,.06))}
.tube{position:relative;z-index:1;width:var(--tw);height:calc(var(--u)*4.7);cursor:pointer;flex:none;will-change:transform;
  transition:transform .32s cubic-bezier(.34,1.56,.64,1)}
.glass{position:absolute;top:0;left:0;right:0;bottom:0;z-index:1;overflow:hidden;display:flex;flex-direction:column-reverse;padding:0 3px 3px;
  border:2px solid var(--glassEdge);border-top:0;border-radius:calc(var(--tw)*.14) calc(var(--tw)*.14) calc(var(--tw)/2) calc(var(--tw)/2);
  background:linear-gradient(90deg,rgba(255,255,255,.62),var(--glass) 26%,var(--glass) 70%,rgba(255,255,255,.16) 86%,rgba(255,255,255,.5));
  transition:border-color .2s,box-shadow .2s}
:root.dark .glass{background:linear-gradient(90deg,rgba(255,255,255,.18),var(--glass) 26%,var(--glass) 70%,rgba(255,255,255,.05) 86%,rgba(255,255,255,.14))}
.glass::after{content:"";position:absolute;z-index:3;left:14%;right:14%;bottom:5px;height:22%;border-radius:0 0 999px 999px;
  box-shadow:inset 0 -3px 0 rgba(255,255,255,.42);pointer-events:none}
.pool{position:absolute;z-index:0;left:-40%;right:-40%;bottom:-13px;height:26px;border-radius:50%;pointer-events:none;
  background:radial-gradient(closest-side,var(--gc,transparent),rgba(255,255,255,0));opacity:.5;transition:opacity .3s}
:root.dark .pool{opacity:.75}
.tube::before{content:"";position:absolute;z-index:2;left:-4px;right:-4px;top:-5px;height:9px;border-radius:5px;
  background:linear-gradient(180deg,rgba(255,255,255,.97),rgba(255,255,255,.6));border:1.5px solid var(--glassEdge)}
:root.dark .tube::before{background:linear-gradient(180deg,rgba(255,255,255,.4),rgba(255,255,255,.1))}
.tube::after{content:"";position:absolute;z-index:3;left:19%;top:12px;height:58%;width:4px;border-radius:4px;pointer-events:none;
  background:linear-gradient(180deg,rgba(255,255,255,.95),rgba(255,255,255,0))}
.liq{flex:none;position:relative;background:linear-gradient(90deg,var(--cl),var(--c) 30%,var(--c) 68%,var(--cd))}
.liq:first-child{border-radius:0 0 calc(var(--tw)/2 - 5px) calc(var(--tw)/2 - 5px)}
.liq.top::before{content:"";position:absolute;left:0;right:0;top:calc(var(--u)*-.11);height:calc(var(--u)*.22);border-radius:50%;
  background:var(--cm);box-shadow:inset 0 1px 0 rgba(255,255,255,.6)}
.liq.wave::before,.tube.sel .liq.top::before{animation:wave .6s ease-out}
@keyframes wave{0%{transform:scaleY(2.4)}35%{transform:scaleY(.5)}65%{transform:scaleY(1.4)}100%{transform:scaleY(1)}}
.bb{position:absolute;z-index:2;width:5px;height:5px;border-radius:50%;background:rgba(255,255,255,.8);pointer-events:none}
.cork{position:absolute;z-index:4;left:17%;right:17%;top:calc(var(--u)*-.44);height:calc(var(--u)*.64);border-radius:6px 6px 3px 3px;
  background:linear-gradient(90deg,#B47D4A,#E5BA8D 36%,#CB9765 68%,#A6713F);box-shadow:inset 0 -3px 0 rgba(0,0,0,.14),0 2px 3px rgba(0,0,0,.18)}
.cork::after{content:"♥";position:absolute;top:0;left:0;right:0;bottom:0;display:grid;place-items:center;color:var(--accent);
  font-family:system-ui,sans-serif;font-size:calc(var(--u)*.36);line-height:1}
.cork.fresh{animation:cork .55s cubic-bezier(.34,1.56,.64,1)}
@keyframes cork{from{transform:translateY(calc(var(--u)*-1.3));opacity:0}}
.tube.done{cursor:default}
.tube.sel{transform:translateY(-22px)}
.tube.sel .glass{border-color:var(--accent);box-shadow:0 0 0 3px var(--accentSoft)}
.tube.sel .pool{opacity:.12}
.tube.pouring .pool{opacity:0;transition:none}
.tube.hint{animation:hop .45s 4 alternate ease-in-out}
.tube.hint .glass{border-color:var(--gold);box-shadow:0 0 0 4px var(--goldSoft)}
@keyframes hop{to{transform:translateY(-12px)}}
.tube.enter{animation:drop .6s cubic-bezier(.3,1.35,.5,1) backwards;animation-delay:calc(var(--i)*28ms)}
@keyframes drop{from{transform:translateY(-80px);opacity:0}}
.stream{position:fixed;z-index:8;width:6px;border-radius:3px;pointer-events:none;transform-origin:top;background:linear-gradient(90deg,var(--cl),var(--c))}
body.hard::after{content:"";position:fixed;top:0;right:0;bottom:0;left:0;pointer-events:none;box-shadow:inset 0 0 150px rgba(255,74,28,.3)}

/* нижняя панель */
.dock{width:calc(100% - 24px);max-width:456px;margin:0 12px 12px;display:flex;justify-content:space-around;padding:10px 4px 9px;border-radius:26px;
  background:var(--surf);border:1px solid var(--edge);box-shadow:var(--shadow);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px)}
.tool{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:9.5px;font-weight:600;letter-spacing:-.02em;position:relative}
.tool .k{width:48px;height:48px;border-radius:16px;display:grid;place-items:center;background:var(--key);
  box-shadow:inset 0 -3px 0 var(--line),0 6px 12px -8px var(--shc);transition:transform .14s cubic-bezier(.34,1.56,.64,1),opacity .2s}
.tool .k svg{width:24px;height:24px}
.tool:active .k{transform:scale(.9)}
.tool.empty .k{opacity:.45}
.tool.busy .k{animation:pulse .7s ease-in-out infinite alternate}
@keyframes pulse{to{opacity:.4}}
.tool em{position:absolute;top:-6px;left:calc(50% + 11px);min-width:21px;height:21px;padding:0 5px;border-radius:11px;background:var(--accent);color:#fff;
  font-style:normal;font-size:11px;font-weight:700;display:grid;place-items:center;border:2px solid var(--sheet)}
.tool em.plus{background:var(--gold);color:#4A2C00}
body.hard .tool.aid{display:none}

/* окна */
.wrap{position:fixed;top:0;right:0;bottom:0;left:0;z-index:6;display:none;background:var(--overlay)}
.wrap.on{display:flex}
.sheetwrap{align-items:flex-end;justify-content:center}
#pop{align-items:center;justify-content:center;padding:20px}
.sheet{width:100%;max-width:480px;max-height:88%;overflow:auto;background:var(--sheet);border-radius:28px 28px 0 0;
  padding:8px 18px calc(20px + env(safe-area-inset-bottom,0px));animation:slide .34s cubic-bezier(.2,.8,.2,1)}
@keyframes slide{from{transform:translateY(100%)}}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:4px auto 14px}
.sh-head{display:flex;align-items:center;gap:10px}
.sh-head h2{flex:1;margin:0;font-size:22px;font-weight:700;letter-spacing:-.02em}
.x{width:36px;height:36px;border-radius:12px;background:var(--line);display:grid;place-items:center}
.x svg{width:18px;height:18px}
.sec{margin:22px 2px 10px;font-size:13px;font-weight:600;color:var(--ink2)}
.item{display:flex;align-items:center;gap:12px;padding:12px;border-radius:20px;background:var(--surf);border:1px solid var(--edge);margin-bottom:8px}
.tile{width:46px;height:46px;border-radius:15px;display:grid;place-items:center;flex:none;background:var(--accentSoft);color:var(--accent)}
.tile svg{width:24px;height:24px}
.item .tx{flex:1;min-width:0;font-size:11px;color:var(--ink2);line-height:1.45}
.item .tx b{display:block;font-size:14px;color:var(--ink);font-weight:600;margin-bottom:2px}
.buy{display:inline-flex;align-items:center;gap:6px;height:40px;padding:0 14px;border-radius:13px;background:var(--accent);color:#fff;font-weight:700;font-size:14px;
  box-shadow:inset 0 -3px 0 rgba(0,0,0,.16);flex:none;transition:transform .12s}
.buy:active{transform:scale(.94)}
.buy .coin{width:16px;height:16px}
.buy:disabled{background:var(--line);color:var(--ink2);box-shadow:none}
.themes{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.th{border-radius:20px;padding:8px 8px 10px;background:var(--surf);border:2px solid var(--edge);text-align:left;display:flex;flex-direction:column;gap:6px;transition:transform .12s}
.th:active{transform:scale(.97)}
.th.cur{border-color:var(--accent)}
.th:disabled{opacity:.5}
.prev{height:72px;border-radius:14px;display:flex;align-items:flex-end;justify-content:center;gap:8px;padding-bottom:11px}
.prev i{width:14px;height:42px;border-radius:3px 3px 8px 8px;border:1.5px solid rgba(255,255,255,.9);
  background:linear-gradient(to top,var(--c) 0,var(--c) 62%,rgba(255,255,255,.3) 62%)}
.th b{font-size:13px;font-weight:600;padding:0 4px}
.th small{font-size:11px;color:var(--ink2);padding:0 4px;display:flex;align-items:center;gap:5px;height:16px}
.th small .coin{width:14px;height:14px}
.set{display:flex;align-items:center;gap:12px;padding:13px 14px;border-radius:18px;background:var(--surf);border:1px solid var(--edge);
  margin-bottom:8px;font-size:13px;font-weight:600;width:100%;text-align:left}
.set span{flex:1}
.sw{width:48px;height:28px;border-radius:14px;background:var(--line);position:relative;transition:background .2s;flex:none}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .2s}
.sw.on{background:var(--accent)}
.sw.on::after{transform:translateX(20px)}
.ver{text-align:center;font-size:10px;color:var(--ink2);margin-top:18px}
.card{width:100%;max-width:360px;max-height:92%;overflow:auto;background:var(--sheet);border-radius:30px;padding:24px 22px 20px;text-align:center;
  box-shadow:0 40px 80px -30px rgba(0,0,0,.6);animation:pop .42s cubic-bezier(.34,1.56,.64,1)}
@keyframes pop{from{transform:scale(.86);opacity:0}}
.card h3{margin:0;font-size:22px;font-weight:700;letter-spacing:-.02em}
.lead{font-size:12px;color:var(--ink2);margin:10px 0 18px;line-height:1.55}
.stars{display:flex;justify-content:center;align-items:flex-end;gap:4px;margin:12px 0 6px}
.stars span{width:54px;height:54px;color:var(--line)}
.stars span:nth-child(2){width:70px;height:70px;margin-bottom:12px}
.stars svg{width:100%;height:100%}
.stars .on{color:var(--gold);animation:star .55s cubic-bezier(.34,1.56,.64,1) backwards;animation-delay:var(--d)}
@keyframes star{from{transform:scale(0) rotate(-45deg)}}
.sweet{font-family:var(--hand);font-size:26px;line-height:1.1;color:var(--accent);margin:0 0 14px}
.rw{display:flex;gap:8px;justify-content:center;margin-bottom:14px}
.rw .chip{height:34px;font-size:13px;font-weight:700;padding:0 14px}
.crit{list-style:none;margin:0 0 16px;padding:12px 14px;border-radius:18px;background:var(--surf);border:1px solid var(--edge);text-align:left;font-size:11.5px;display:grid;gap:9px}
.crit li{display:flex;align-items:center;gap:10px;color:var(--ink2);line-height:1.35}
.crit li i{width:19px;height:19px;border-radius:50%;flex:none;background:var(--line);display:grid;place-items:center}
.crit li.ok{color:var(--ink)}
.crit li.ok i{background:var(--gold);color:#fff}
.crit svg{width:12px;height:12px;stroke-width:3.2}
.letter{position:relative;margin:16px 0 16px;padding:26px 16px 14px;border-radius:18px;background:#fff;color:#2B1B44;box-shadow:0 12px 26px -14px rgba(43,27,68,.55)}
.letter p{margin:0;font-family:var(--hand);font-size:27px;line-height:1.12}
.letter small{display:block;margin-top:8px;font-family:var(--hand);font-size:19px;color:#8A7A9C;text-align:right}
.seal{position:absolute;top:-17px;left:50%;margin-left:-18px;width:36px;height:36px;border-radius:50%;background:var(--accent);color:#fff;
  display:grid;place-items:center;box-shadow:0 5px 12px -3px var(--accentGlow)}
.seal svg{width:17px;height:17px}
.gift{display:flex;align-items:center;justify-content:center;gap:8px;margin:0 0 16px;padding:11px;border-radius:16px;background:var(--goldSoft);font-size:12px;font-weight:600}
.gift svg{width:20px;height:20px;color:#A8650A}
.card .btn{width:100%;height:58px;font-size:17px}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin:4px 0 18px}
.day{border-radius:12px;padding:7px 0 7px;background:var(--surf);border:1px solid var(--edge);display:flex;flex-direction:column;align-items:center;gap:5px;font-size:10px;color:var(--ink2)}
.day b{font-size:11px;color:var(--ink)}
.day .coin{width:14px;height:14px}
.day.past{opacity:.45}
.day.today{background:var(--accent);border-color:var(--accent);color:#fff;transform:translateY(-3px);box-shadow:0 10px 16px -10px var(--accentGlow)}
.day.today b{color:#fff}
.toast{position:fixed;left:50%;bottom:calc(122px + env(safe-area-inset-bottom,0px));transform:translate(-50%,8px);z-index:7;background:var(--ink);color:var(--sky1);
  padding:10px 18px;border-radius:16px;font-size:12px;font-weight:600;line-height:1.4;opacity:0;transition:opacity .25s,transform .25s;pointer-events:none;
  width:max-content;max-width:88%;text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
.heart{position:fixed;bottom:-40px;z-index:9;pointer-events:none;animation:up 3.2s cubic-bezier(.3,.6,.4,1) forwards}
.heart svg{width:100%;height:100%}
@keyframes up{to{transform:translateY(-112vh) rotate(25deg);opacity:0}}
#fx{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:8}
.ghost{display:inline-flex;align-items:center;gap:7px;height:42px;padding:0 18px;border-radius:14px;font-size:13px;font-weight:600;
  background:var(--surf);border:1px solid var(--edge);margin-top:2px;transition:transform .12s}
.ghost:active{transform:scale(.95)}
.ghost svg{width:18px;height:18px;color:var(--accent)}
/* профиль */
.pf-head{display:flex;align-items:center;gap:14px;flex:1;min-width:0}
.pf-ava{width:70px;height:70px;border-radius:50%;flex:none;background:var(--surf) center/cover;box-shadow:0 0 0 3px var(--key),0 10px 20px -10px var(--shc)}
.pf-name{flex:1;min-width:0}
.pf-name h2{margin:0;font-family:var(--hand);font-weight:400;font-size:31px;line-height:1}
.pf-name small{display:block;font-size:12px;font-weight:600;margin-top:7px}
.pf-name em{display:block;font-style:normal;font-size:10.5px;color:var(--ink2);margin-top:5px}
.bar{height:8px;border-radius:4px;background:var(--line);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;border-radius:4px;background:linear-gradient(90deg,var(--accent),var(--gold))}
.since{font-size:11px;color:var(--ink2);margin:14px 2px 0}
.stats{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px}
.stat{padding:14px 14px 12px;border-radius:18px;background:var(--surf);border:1px solid var(--edge)}
.stat b{display:flex;align-items:center;gap:6px;font-size:21px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums;white-space:nowrap}
.stat b svg{width:18px;height:18px;color:var(--gold);flex:none}
.stat span{display:block;font-size:11px;color:var(--ink2);margin-top:5px}
.mini{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.mini .chip{height:28px;font-size:11px;font-weight:500}
.mini .chip b{font-weight:700}
.letters{display:grid;grid-template-columns:minmax(0,1fr);gap:8px}
.lt{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:16px;background:var(--surf);border:1px solid var(--edge);text-align:left;width:100%;transition:transform .12s}
.lt:active{transform:scale(.98)}
.lt .env{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;flex:none;background:var(--accentSoft);color:var(--accent)}
.lt .env svg{width:21px;height:21px}
.lt>div{flex:1;min-width:0;font-size:11px;color:var(--ink2)}
.lt>div b{display:block;font-size:13px;color:var(--ink);font-weight:600;margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lt.locked{opacity:.6;cursor:default}
.lt.locked .env{background:var(--line);color:var(--ink2)}
.more{font-size:11px;color:var(--ink2);text-align:center;padding:4px}
.achs{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px}
.ach{padding:12px;border-radius:18px;background:var(--surf);border:1px solid var(--edge);display:flex;flex-direction:column;gap:5px}
.medal{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;flex:none;background:linear-gradient(145deg,#FFE6A6,#F5B03E);color:#7A4700;box-shadow:inset 0 -3px 0 rgba(0,0,0,.12)}
.medal svg{width:20px;height:20px}
.ach b{font-size:12px;font-weight:600;margin-top:3px}
.ach span{font-size:10.5px;color:var(--ink2);line-height:1.4}
.ach .bar{height:5px;margin-top:3px}
.ach small{font-size:10px;color:var(--ink2);display:flex;align-items:center;gap:4px}
.ach small .coin{width:12px;height:12px}
.ach.locked .medal{background:var(--line);color:var(--ink2);box-shadow:none}
.ach.locked b{color:var(--ink2)}
.banner{position:fixed;left:50%;top:calc(10px + env(safe-area-inset-top,0px));z-index:10;transform:translate(-50%,-150%);display:flex;align-items:center;gap:12px;
  padding:10px 18px 10px 10px;border-radius:20px;background:var(--sheet);box-shadow:0 18px 40px -16px rgba(0,0,0,.5);width:max-content;max-width:92%;
  transition:transform .45s cubic-bezier(.34,1.56,.64,1);pointer-events:none}
.banner.on{transform:translate(-50%,0)}
.banner div{font-size:11px;color:var(--ink2);display:flex;flex-direction:column;gap:2px}
.banner b{font-size:13px;color:var(--ink)}
.banner .coin{width:13px;height:13px}
@media (max-height:700px){.ava{width:172px;height:172px}.love{font-size:36px;margin-top:18px}#menu{margin-top:18px}.btn{height:58px}.secondary{height:52px}
  .head{min-height:68px}.lvl b{font-size:28px}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}.ring .pr{stroke-dashoffset:0}}
</style>
</head>

<!-- Ядро: генерация уровней и решатель. Работает в фоновом потоке (Web Worker), при недоступности — в основном. -->
<script id="core">
var CAP=4;
function rng(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function colorsFor(n){return Math.min(12,5+Math.floor(Math.sqrt(n-1)/4.5))}
function solved(t){return t.every(function(x){return x.length===0||(x.length===CAP&&x.every(function(v){return v===x[0]}))})}
function key(t){return t.map(function(x){return x.join(",")}).sort().join("|")}
function solvable(t0,lim,full,path,ban){
  var seen=new Set(ban||[]);seen.delete(key(t0));var n=0;
  function dfs(t){
    if(solved(t))return true;
    var k=key(t);if(seen.has(k)||++n>lim)return false;seen.add(k);
    var mv=[];
    for(var a=0;a<t.length;a++){var A=t[a];if(!A.length)continue;
      var v=A[A.length-1],uni=A.every(function(z){return z===v});
      if(uni&&A.length===CAP)continue;
      for(var b=0;b<t.length;b++){var B=t[b];
        if(a===b||B.length>=CAP)continue;
        if(B.length?B[B.length-1]!==v:uni)continue;
        mv.push([B.length?0:1,a,b])}}
    mv.sort(function(p,q){return p[0]-q[0]});
    for(var i=0;i<mv.length;i++){var a2=mv[i][1],b2=mv[i][2],u=t.map(function(x){return x.slice()}),A2=u[a2],B2=u[b2],v2=A2[A2.length-1];
      while(A2.length&&A2[A2.length-1]===v2&&B2.length<CAP)B2.push(A2.pop());
      if(dfs(u)){if(path)path.push([a2,b2]);return true}}
    return false}
  var r=dfs(t0);return full?(r?1:n>lim?-1:0):r}
function gen(n,E,hd){
  var c=Math.min(12,colorsFor(n)+(hd?1:0)),M=Math.floor(Math.min(c*30,60+c*8+n*0.5)),t;
  for(var att=0;att<(E>1?30:20);att++){
    var r=rng(n*7919+13+att*101+(hd?5:0));
    t=[];for(var i=0;i<c;i++)t.push(Array(CAP).fill(i));for(i=0;i<E;i++)t.push([]);
    for(var k=0;k<M;k++){
      var f=[];for(i=0;i<t.length;i++)if(t[i].length)f.push(i);var a=f[Math.floor(r()*f.length)];
      var g=[];for(i=0;i<t.length;i++)if(t[i].length<CAP&&i!==a&&t[i][t[i].length-1]!==t[a][t[a].length-1])g.push(i);
      if(!g.length)continue;t[g[Math.floor(r()*g.length)]].push(t[a].pop());
    }
    if(!solved(t)&&solvable(t,E>1?40000:15000))return t;
  }
  return E>1?t:null;
}
function makeLevel(n,hd){return (hd&&gen(n,1,true))||gen(n,2,hd)}
function hintPath(t,ban){var p=[];if(!solvable(t,60000,false,p,ban)){p=[];if(!solvable(t,60000,false,p))return null}return p.reverse()}
function coreRun(op,a){if(op==="level")return makeLevel(a.n,a.hd);if(op==="hint")return hintPath(a.t,a.ban);if(op==="check")return solvable(a.t,40000,true);return 1}
</script>

let WK=null,wid=0;const pend=new Map();
function initWorker(){
  try{
    const src=$("#core").textContent+"\nself.onmessage=function(e){var d=e.data,r=null;try{r=coreRun(d.op,d.a)}catch(x){}self.postMessage({id:d.id,r:r})};";
    WK=new Worker(URL.createObjectURL(new Blob([src],{type:"text/javascript"})));
    WK.onmessage=e=>{const p=pend.get(e.data.id);if(p){pend.delete(e.data.id);clearTimeout(p.to);p.res(e.data.r)}};
    WK.onerror=()=>killWorker();
    call("ping",{},2000);
  }catch(e){WK=null}
}
function killWorker(){if(!WK)return;try{WK.terminate()}catch(e){}WK=null;
  const all=[...pend.values()];pend.clear();all.forEach(p=>{clearTimeout(p.to);let r=null;try{r=coreRun(p.op,p.a)}catch(e){}p.res(r)})}
function call(op,a,timeout){return new Promise(res=>{
  if(!WK){setTimeout(()=>{let r=null;try{r=coreRun(op,a)}catch(e){}res(r)},0);return}
  const id=++wid,p={res,op,a};pend.set(id,p);
  if(timeout)p.to=setTimeout(()=>{if(pend.has(id))killWorker()},timeout);
  WK.postMessage({id,op,a})})}

    if(LC.size>10)LC.delete(LC.keys().next().value)}
  return LC.get(k).then(t=>t?t.map(x=>x.slice()):coreRun("level",{n,hd}))}

function layout(n){

  let best={rows:1,u:0};
  for(let rows=1;rows<=4;rows++){
    const per=Math.ceil(n/rows),uW=(W-44)/(per*1.45+(per-1)*.45),uH=(H-(rows-1)*18-rows*7)/(rows*5.2),u=Math.min(40,uW,uH);
    if(u>best.u+.5)best={rows,u};
  }
  U=Math.max(16,Math.floor(best.u));
  bd.style.setProperty("--u",U+"px");bd.style.setProperty("--tw",Math.round(U*1.45)+"px");bd.style.setProperty("--g",Math.round(U*.45)+"px");
  return best.rows;
}

function loop(){cx.clearRect(0,0,innerWidth,innerHeight);P=P.filter(p=>p.l<p.m);
  for(const p of P){p.l++;p.vx*=p.f;p.vy=p.vy*p.f+p.g;p.x+=p.vx;p.y+=p.vy;cx.globalAlpha=Math.max(0,1-p.l/p.m);cx.fillStyle=p.c;cx.beginPath();cx.arc(p.x,p.y,p.r,0,6.283);cx.fill()}
  cx.globalAlpha=1;raf=P.length?requestAnimationFrame(loop):0}

  for(let i=0;i<n;i++){const a=Math.random()*6.283,s=sp*(.35+Math.random()*.65);P.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:0,m:45+Math.random()*40,c:cols[i%cols.length],g,f:.985,r:1.6+Math.random()*1.7})}kick()}

});

// ---------- профиль ----------
const fmtTime=s=>{const h=Math.floor(s/3600),m=Math.floor(s%3600/60);return h?`${h} ч ${m} мин`:`${m} мин`};
const nf=n=>String(n).replace(/\B(?=(\d{3})+(?!\d))/g," ");
function profile(){
  const T=S.st,rk=rankOf(S.xp),nd=doneN(),hd=doneH(),wins=T.wn+T.wh,avg=wins?Math.min(3,S.stars/wins):0,photo=PHOTO||S.photo;
  let since="";try{since=new Date(T.since).toLocaleDateString("ru-RU",{day:"numeric",month:"long",year:"numeric"})}catch(e){}
  let h=`<div class="sh-head"><div class="pf-head"><span class="pf-ava" style="background-image:url(${photo})"></span>
    <div class="pf-name"><h2>Моя кохана ❤️</h2><small>${rankTitle(rk)}, ранг ${rk}</small><div class="bar"><i style="width:${(S.xp%50)*2}%"></i></div>
    <em>Ещё ${50-S.xp%50} опыта до следующего ранга</em></div></div><button class="x" data-close="prof" aria-label="Закрыть">${ic("x")}</button></div>`;
  if(since)h+=`<p class="since">Играет с ${since}</p>`;
  const tile=(v,l,star)=>`<div class="stat"><b>${star?ic("star"):""}${v}</b><span>${l}</span></div>`;
  h+=`<div class="sec">Статистика</div><div class="stats">
    ${tile(fmtTime(T.time),"в игре")}${tile(nf(nd+hd),"уровней пройдено")}
    ${tile(nf(S.stars),"звёзд всего",1)}${tile(wins?avg.toFixed(1).replace(".",","):"—","в среднем из 3",1)}
    ${tile(nf(T.moves),"переливаний")}${tile(T.best+" "+(T.best%10===1&&T.best%100!==11?"день":[2,3,4].includes(T.best%10)&&![12,13,14].includes(T.best%100)?"дня":"дней"),"лучшая серия")}</div>
    <div class="mini"><span class="chip">Обычные <b>${nf(nd)}</b></span><span class="chip">Хард <b>${nf(hd)}</b></span><span class="chip">Дней в игре <b>${T.days}</b></span>
    <span class="chip">Подсказок <b>${T.hints}</b></span><span class="chip">Монет заработано <b>${nf(T.earned)}</b></span></div>`;
  const got=Math.min(LETTERS.length,Math.floor(nd/10));
  h+=`<div class="sec">Шкатулка писем: ${got+(T.fin?1:0)} из ${LETTERS.length+1}</div><div class="letters">`;
  for(let i=0;i<got;i++)h+=`<button class="lt" data-letter="${i}"><span class="env">${ic("mail")}</span><div><b>${LETTERS[i]}</b>Письмо за ${(i+1)*10} уровней</div></button>`;
  for(let i=got;i<Math.min(LETTERS.length,got+2);i++)h+=`<button class="lt locked" disabled><span class="env">${ic("lock")}</span><div><b>Запечатано</b>Откроется на уровне ${(i+1)*10}</div></button>`;
  if(LETTERS.length-got>2)h+=`<div class="more">и ещё ${LETTERS.length-got-2} впереди</div>`;
  h+=T.fin?`<button class="lt" data-letter="-1"><span class="env">${ic("heart")}</span><div><b>${FINAL}</b>Письмо за 1000 уровней</div></button>`
    :`<button class="lt locked" disabled><span class="env">${ic("lock")}</span><div><b>Особое письмо</b>Откроется после 1000-го уровня</div></button>`;
  h+=`</div><div class="sec">Достижения: ${S.ach.length} из ${ACH.length}</div><div class="achs">`;
  for(const a of ACH){const ok=S.ach.includes(a.id),v=Math.min(a.v(),a.g),pr=a.t?`${(v/3600).toFixed(1).replace(".",",")} из ${a.g/3600} ч`:`${nf(v)} из ${nf(a.g)}`;
    h+=`<div class="ach${ok?"":" locked"}"><span class="medal">${ic("trophy")}</span><b>${a.n}</b><span>${a.d}</span>${ok?"":`<div class="bar"><i style="width:${v/a.g*100}%"></i></div><small>${pr}</small>`}<small>Награда +${a.r} <i class="coin"></i></small></div>`}
  h+=`</div>`;
  $("#pfBody").innerHTML=h;
}
$("#pfBody").onclick=e=>{const b=e.target.closest("button");if(!b||b.disabled)return;
  if(b.dataset.close)closeSheet(b.dataset.close);
  else if(b.dataset.letter!==undefined){const i=+b.dataset.letter;
    card(i<0?"Письмо за 1000 уровней":`Письмо за ${(i+1)*10} уровней`,`<div class="letter"><span class="seal">${ic("heart")}</span><p>${i<0?FINAL:LETTERS[i]}</p><small>— твій чоловік</small></div>`,"Закрыть")}};

// ---------- достижения ----------
const BQ=[];let bOn=false;
function checkAch(){let any=false;for(const a of ACH){if(S.ach.includes(a.id)||a.v()<a.g)continue;S.ach.push(a.id);S.coins+=a.r;S.st.earned+=a.r;BQ.push(a);any=true}
  if(any){save();setCoins();if(!bOn)nextBanner()}}
function nextBanner(){const a=BQ.shift(),el=$("#banner");if(!a){bOn=false;return}bOn=true;
  el.innerHTML=`<span class="medal">${ic("trophy")}</span><div><b>${a.n}</b><span>Достижение открыто, +${a.r} <i class="coin"></i></span></div>`;
  el.classList.add("on");tone(988,.12,0,"triangle");tone(1319,.22,.1,"triangle");vib(20);
  setTimeout(()=>{el.classList.remove("on");setTimeout(nextBanner,500)},2500)}
$("#coinsBtn").onclick=openShop;
$("#snd").onclick=()=>{S.snd=S.snd?0:1;save();hud();tone(660,.08)};

// ---------- меню, подарок дня ----------
function menu(){
  flushKeep();tok++;locked=false;sel=null;flying=false;hideHint();CQ.length=0;$("#pop").classList.remove("on");document.querySelectorAll(".sheetwrap").forEach(w=>w.classList.remove("on"));
  $("#play").innerHTML=`Играть<small>уровень ${S.level}</small>`;
  $("#playH").innerHTML=`<span class="hl">${ic("flame")}Хард</span><small>уровень ${S.hl}</small>`;
  $("#stats").innerHTML=`<span class="chip">${ic("star")}${S.stars}</span><span class="chip">${rankTitle(rankOf(S.xp))}</span><span class="chip"><i class="coin"></i>${S.coins}</span>`;
  document.body.classList.add("onSplash");$("#splash").classList.remove("hide");
}
function go(h){actx();hard=h;nav("game");setTimeout(checkAch,1500);$("#splash").classList.add("hide");document.body.classList.remove("onSplash");start();daily();tone(523,.1);
  if(!S.tut){S.tut=1;save();setTimeout(()=>toast("Нажми на пробирку, а потом на ту, куда перелить"),900)}}
$("#play").onclick=()=>go(false);$("#playH").onclick=()=>go(true);$("#home").onclick=()=>{if(history.state&&history.state.k==="game")history.back();else menu()};
const fd=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
function daily(){
  const now=new Date(),day=fd(now),y=fd(new Date(now.getFullYear(),now.getMonth(),now.getDate()-1));
  const sp=()=>{if(SPECIAL.d&&day.slice(5)===SPECIAL.d&&S.sp!==now.getFullYear()){S.sp=now.getFullYear();const f=S.coins;S.coins+=100;S.st.earned+=100;save();holdCoins(f);hearts();fireworks(5);
    card("Особливий день",`<div class="letter"><span class="seal">${ic("heart")}</span><p>${SPECIAL.t}</p><small>— твій чоловік</small></div><div class="rw"><span class="chip"><i class="coin"></i>+100</span></div>`,"Дякую ❤️",r=>flyCoins(100,r))}};
  if(S.day===day){sp();return}
  S.st.run=S.day===y?S.st.run+1:1;S.st.best=Math.max(S.st.best,S.st.run);S.st.days++;
  S.streak=S.day===y?Math.min(S.streak+1,7):1;S.day=day;const g=10+S.streak*5,f=S.coins;S.coins+=g;S.st.earned+=g;save();holdCoins(f);
  const dn=Math.floor(now.getTime()/864e5);
  const wk=Array.from({length:7},(_,i)=>{const d=i+1;return `<div class="day${d<S.streak?" past":d===S.streak?" today":""}"><span>${d}</span><i class="coin"></i><b>${10+d*5}</b></div>`}).join("");
  card("Подарок дня",`<p class="sweet" style="margin-top:10px">${SWEET[dn%SWEET.length]}</p><p class="lead" style="margin-top:0">Заходи каждый день — подарок растёт до седьмого дня подряд.</p><div class="week">${wk}</div>`,`Забрать +${g}`,r=>{flyCoins(g,r);sp();setTimeout(checkAch,900)});
}

// ---------- старт ----------
$("#home").innerHTML=ic("home");$("#profBtn").innerHTML=ic("user")+"Профиль и письма";
$("#rank").onclick=openProfile;$("#profBtn").onclick=openProfile;
// время в игре: считается только когда игра на экране и были касания за последние 90 секунд
let lastAct=performance.now();
document.addEventListener("pointerdown",()=>{lastAct=performance.now()},{capture:true,passive:true});
setInterval(()=>{if(document.hidden||document.body.classList.contains("onSplash")||performance.now()-lastAct>90000)return;
  S.st.time+=5;if(S.st.time%60===0){save();checkAch()}},5000);$("#badge").innerHTML=ic("heart");$("#closeShop").innerHTML=ic("x");
if(!reduce)for(let i=0;i<12;i++){const b=document.createElement("span"),s=6+Math.random()*16;b.className="bub";
  b.style.cssText=`left:${Math.random()*96}%;width:${s}px;height:${s}px;animation-duration:${9+Math.random()*8}s;animation-delay:${-Math.random()*14}s`;$("#splash").appendChild(b)}
initWorker();
getLevel(S.level,false);getLevel(S.hl,true);
menu();
setTimeout(()=>{$("#splash").classList.add("ready");setTimeout(checkAch,600)},reduce?0:2200);
let rzT=0;addEventListener("resize",()=>{clearTimeout(rzT);rzT=setTimeout(()=>{if(!tubes.length)return;if(locked)needBuild=true;else build(false)},120)});
addEventListener("pagehide",flushKeep);
document.addEventListener("visibilitychange",()=>{if(document.hidden)flushKeep()});
if("serviceWorker" in navigator&&location.protocol.startsWith("http"))addEventListener("load",()=>{navigator.serviceWorker.register("sw.js").catch(()=>{})});
</script>
</body>
</html>
